[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insitulink"
version = "1.0.0"
description = "Traceable alignment of in-situ experiment frames and external parameters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
preview = ["h5py>=3.8", "fabio>=2023.4", "pyFAI>=2024.10"]

[project.scripts]
insitulink = "insitulink.cli:main"
strainlink = "strainlink.agent:main"

[project.urls]
Repository = "https://github.com/D-sudoasd/InSituLink"
Issues = "https://github.com/D-sudoasd/InSituLink/issues"

[tool.setuptools.packages.find]
include = ["insitulink*", "strainlink*"]
